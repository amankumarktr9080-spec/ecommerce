<div class="glass-card" style="padding: 24px; margin-top: 24px;">
    <h3 style="margin: 0 0 16px; color: var(--text-primary);"><i class="fa-solid fa-key"></i> Reset Password</h3>
    <form method="post" action="{% url 'users:change_password' %}" style="display: grid; gap: 12px; max-width: 520px;">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}?show=password">
        <div style="position: relative;">
            <input id="change-current-password" type="password" name="current_password" required minlength="6" maxlength="10" placeholder="Current password (6-10 characters)" autocomplete="current-password" style="width: 100%; padding: 12px 42px 12px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-app); color: var(--text-primary);">
            <button type="button" data-change-password-toggle="change-current-password" aria-label="Show current password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--text-secondary); cursor: pointer;"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div style="position: relative;">
            <input id="change-new-password" type="password" name="new_password" required minlength="6" maxlength="10" placeholder="New password (6-10 characters)" autocomplete="new-password" style="width: 100%; padding: 12px 42px 12px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-app); color: var(--text-primary);">
            <button type="button" data-change-password-toggle="change-new-password" aria-label="Show new password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--text-secondary); cursor: pointer;"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div style="position: relative;">
            <input id="change-confirm-password" type="password" name="confirm_password" required minlength="6" maxlength="10" placeholder="Confirm new password" autocomplete="new-password" style="width: 100%; padding: 12px 42px 12px 12px; border: 1px solid var(--border-color); color: var(--text-primary); background: var(--bg-app); border-radius: 8px;">
            <button type="button" data-change-password-toggle="change-confirm-password" aria-label="Show confirm password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--text-secondary); cursor: pointer;"><i class="fa-solid fa-eye"></i></button>
        </div>
        <button type="submit" class="btn btn-primary" style="justify-self: start;"><i class="fa-solid fa-lock"></i> Change Password</button>
    </form>
</div>

<script>
document.querySelectorAll('[data-change-password-toggle]').forEach((button) => {
    button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.changePasswordToggle);
        const hiding = input.type === 'text';
        input.type = hiding ? 'password' : 'text';
        button.setAttribute('aria-label', hiding ? 'Show password' : 'Hide password');
        button.innerHTML = `<i class="fa-solid fa-eye${hiding ? '' : '-slash'}"></i>`;
    });
});
</script>
