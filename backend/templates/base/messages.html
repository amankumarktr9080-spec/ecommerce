{% if messages %}

<div class="messages-container">

    {% for message in messages %}

        <div class="alert alert-{{ message.tags }}">

            <span>
                {{ message }}
            </span>

            <button type="button"
                    class="close-message"
                    onclick="this.parentElement.remove()">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

    {% endfor %}

</div>

{% endif %}
