{% extends "base/base.html" %}

{% block title %}Set New Password - ShopVerse{% endblock %}

{% block content %}
<section style="min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="glass-card" style="width: 100%; max-width: 480px; padding: 36px; border-radius: 20px; box-shadow: var(--shadow-lg);">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 60px; height: 60px; border-radius: 16px; background: var(--accent-gradient); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 1.8rem; margin-bottom: 12px;">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 style="font-size: 1.6rem; font-weight: 700; margin: 0; color: var(--text-primary);">Set New Password</h2>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 6px;">Create a secure password for your account</p>
        </div>

        {% if messages %}
            {% for msg in messages %}
                <div class="toast-msg {% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %}" style="margin-bottom: 18px; animation: none;">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>{{ msg }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="/auth/reset-password/" style="display: flex; flex-direction: column; gap: 18px;">
            {% csrf_token %}
            <input type="hidden" name="token" value="{{ token|default:'' }}">

            <div>
                <label style="display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--text-primary);">New Password</label>
                <input type="password" name="password" required placeholder="Enter new password"
                       style="width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-app); color: var(--text-primary); font-size: 0.9rem; outline: none;">
            </div>

            <div>
                <label style="display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--text-primary);">Confirm New Password</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter new password"
                       style="width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-app); color: var(--text-primary); font-size: 0.9rem; outline: none;">
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer;">
                Update Password & Login
            </button>
        </form>
    </div>
</section>
{% endblock %}
